<app-modal
  [open]="true"
  [title]="titleKey() | translate"
  icon="fa-solid fa-list-check"
  iconTone="purple"
  size="lg"
  [closeOnBackdrop]="!submitting()"
  [closeOnEsc]="!submitting()"
  (closed)="cancel.emit()">

  <form [formGroup]="form" id="task-form" novalidate (ngSubmit)="submit()">
    <div class="row g-3">
      <!-- Title -->
      <div class="col-12">
        <label for="task-title" class="form-label fw-600">
          {{ 'projects.tasksManage.form.title' | translate }} <span class="text-danger">*</span>
        </label>
        <input id="task-title"
               class="form-control"
               formControlName="title"
               [class.is-invalid]="isInvalid('title')"
               [placeholder]="'projects.tasksManage.form.titlePlaceholder' | translate" />
        <app-form-error [control]="form.controls.title" [label]="'projects.tasksManage.form.title' | translate" />
      </div>

      <!-- Project -->
      <div class="col-md-6">
        <label class="form-label fw-600">
          {{ 'projects.tasksManage.form.project' | translate }} <span class="text-danger">*</span>
        </label>
        <app-searchable-select
          formControlName="projectId"
          [pagedFetchFn]="projectsFetchFn"
          labelKey="title"
          valueKey="id"
          [placeholder]="'projects.tasksManage.form.projectPlaceholder' | translate"
          [isInvalid]="isInvalid('projectId')" />
        <app-form-error [control]="form.controls.projectId" [label]="'projects.tasksManage.form.project' | translate" />
      </div>

      <!-- Assignees -->
      <div class="col-md-6">
        <label class="form-label fw-600 d-flex align-items-center gap-2">
          <i class="fa-solid fa-users text-primary"></i>
          {{ 'projects.tasksManage.form.assignee' | translate }} <span class="text-danger">*</span>
        </label>
        <app-multi-select
          formControlName="assignedToIds"
          [options]="developerOptions()"
          [loading]="loadingDevelopers()"
          [placeholder]="'projects.tasksManage.form.assigneePlaceholder' | translate"
          [searchPlaceholder]="'projects.tasksManage.form.assigneeSearch' | translate"
          [emptyText]="'projects.tasksManage.form.assigneeEmpty' | translate">
        </app-multi-select>
        <app-form-error [control]="form.controls.assignedToIds" [label]="'projects.tasksManage.form.assignee' | translate" />
      </div>

      <!-- Status -->
      <div class="col-md-4">
        <label for="task-status" class="form-label fw-600">
          {{ 'projects.tasksManage.form.status' | translate }} <span class="text-danger">*</span>
        </label>
        <select id="task-status" class="form-select" formControlName="status">
          @for (s of statuses; track s) {
            <option [ngValue]="s">{{ 'projects.tasksManage.statuses.' + s | translate }}</option>
          }
        </select>
      </div>

      <!-- Priority -->
      <div class="col-md-4">
        <label for="task-priority" class="form-label fw-600">
          {{ 'projects.tasksManage.form.priority' | translate }} <span class="text-danger">*</span>
        </label>
        <select id="task-priority" class="form-select" formControlName="priority">
          @for (p of priorities; track p) {
            <option [ngValue]="p">{{ 'projects.manage.priorities.' + p | translate }}</option>
          }
        </select>
      </div>

      <!-- Category -->
      <div class="col-md-4">
        <label for="task-category" class="form-label fw-600">
          {{ 'projects.tasksManage.form.category' | translate }} <span class="text-danger">*</span>
        </label>
        <select id="task-category" class="form-select" formControlName="category">
          @for (c of categories; track c) {
            <option [ngValue]="c">{{ 'projects.tasksManage.categories.' + c | translate }}</option>
          }
        </select>
      </div>

      <!-- Due date -->
      <div class="col-md-6">
        <label for="task-due" class="form-label fw-600">
          {{ 'projects.tasksManage.form.dueDate' | translate }} <span class="text-danger">*</span>
        </label>
        <input id="task-due"
               type="date"
               class="form-control"
               formControlName="dueDate"
               [class.is-invalid]="isInvalid('dueDate')" />
        <app-form-error [control]="form.controls.dueDate" [label]="'projects.tasksManage.form.dueDate' | translate" />
      </div>

      <!-- Estimated hours -->
      <div class="col-md-6">
        <label for="task-hours" class="form-label fw-600">
          {{ 'projects.tasksManage.form.estimatedHours' | translate }}
        </label>
        <input id="task-hours"
               type="number"
               min="0"
               step="0.5"
               class="form-control"
               formControlName="estimatedHours"
               [placeholder]="'projects.tasksManage.form.estimatedHoursPlaceholder' | translate" />
      </div>

      <!-- Tags -->
      <div class="col-12">
        <label for="task-tags" class="form-label fw-600">
          {{ 'projects.tasksManage.form.tags' | translate }}
        </label>
        <input id="task-tags"
               class="form-control"
               formControlName="tags"
               [placeholder]="'projects.tasksManage.form.tagsPlaceholder' | translate" />
      </div>

      <!-- Description -->
      <div class="col-12">
        <label for="task-description" class="form-label fw-600">
          {{ 'projects.tasksManage.form.description' | translate }}
        </label>
        <textarea id="task-description"
                  class="form-control"
                  rows="3"
                  formControlName="description"
                  [placeholder]="'projects.tasksManage.form.descriptionPlaceholder' | translate"></textarea>
      </div>
    </div>

    @if (errorMessage()) {
      <div class="alert alert-danger d-flex align-items-center gap-2 py-2 mb-0 mt-3" role="alert">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span>{{ errorMessage() }}</span>
      </div>
    }
  </form>

  <ng-container modal-footer>
    <button type="button" class="btn btn-light" [disabled]="submitting()" (click)="cancel.emit()">
      {{ 'projects.tasksManage.form.cancel' | translate }}
    </button>
    <button type="submit"
            form="task-form"
            class="btn btn-primary"
            [disabled]="submitting() || form.invalid">
      @if (submitting()) {
        <span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
      } @else {
        <i class="fa-solid me-1" [class.fa-plus]="mode === 'create'" [class.fa-floppy-disk]="mode === 'edit'"></i>
      }
      {{ (mode === 'edit' ? 'projects.tasksManage.form.submitEdit' : 'projects.tasksManage.form.submitAdd') | translate }}
    </button>
  </ng-container>
</app-modal>
