<app-modal [open]="true" size="md" icon="fa-solid fa-message" [title]="'clientPortal.newRequest.title' | translate"
           [closeOnBackdrop]="!sending()" (closed)="closed.emit()">
  <div class="d-flex flex-column gap-3">
    <div class="nr-seg" role="radiogroup" [attr.aria-label]="'clientPortal.newRequest.kind' | translate">
      @for (t of types; track t) {
        <button type="button" role="radio" class="nr-seg__btn" [class.is-active]="type() === t" [attr.data-type]="t"
                [attr.aria-checked]="type() === t" [disabled]="sending()" (click)="type.set(t)">
          <i [class]="typeIcon(t)" aria-hidden="true"></i>{{ 'clientPortal.type.' + t | translate }}
        </button>
      }
    </div>
    <p class="nr-hint">{{ 'clientPortal.typeHint.' + type() | translate }}</p>

    <div>
      <label class="form-label" for="nr-title">{{ 'clientPortal.newRequest.titleLabel' | translate }}</label>
      <input id="nr-title" type="text" class="form-control" [maxlength]="titleMax" [disabled]="sending()"
             [placeholder]="'clientPortal.newRequest.titlePlaceholder.' + type() | translate"
             [ngModel]="title()" (ngModelChange)="title.set($event)" />
    </div>

    <div>
      <label class="form-label" for="nr-desc">{{ 'clientPortal.newRequest.details' | translate }}</label>
      <textarea id="nr-desc" class="form-control" rows="5" [maxlength]="textMax" [disabled]="sending()"
                [placeholder]="'clientPortal.newRequest.detailsPlaceholder' | translate"
                [ngModel]="description()" (ngModelChange)="description.set($event)"></textarea>
    </div>

    <app-attachment-picker [disabled]="sending()" [(files)]="files" />

    @if (error(); as e) { <div class="alert alert-danger py-2 mb-0 small">{{ e }}</div> }
  </div>

  <div modal-footer class="d-flex justify-content-end gap-2">
    <button type="button" class="btn btn-light" [disabled]="sending()" (click)="closed.emit()">{{ 'common.cancel' | translate }}</button>
    <button type="button" class="btn btn-primary" [disabled]="!canSend()" (click)="submit()">
      @if (sending()) { <span class="spinner-border spinner-border-sm me-1" aria-hidden="true"></span> }
      @else { <i class="fa-solid fa-paper-plane me-1" aria-hidden="true"></i> }
      {{ 'clientPortal.newRequest.send' | translate }}
    </button>
  </div>
</app-modal>
