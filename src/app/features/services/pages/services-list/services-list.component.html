<section class="services-page">
  <!-- Welcome strip -->
  <div class="mb-4">
    <h2 class="fw-700 mb-1">{{ 'services.welcomeTitle' | translate }}</h2>
    <p class="text-muted mb-0">{{ 'services.welcomeSubtitle' | translate }}</p>
  </div>

  <!-- Page header -->
  <header class="d-flex flex-wrap align-items-start justify-content-between gap-3 mb-4">
    <div class="d-flex align-items-center gap-3">
      <span class="icon-tile xl tone-primary"><i class="fa-solid fa-screwdriver-wrench"></i></span>
      <div>
        <h3 class="fw-700 mb-1">{{ 'services.title' | translate }}</h3>
        <p class="text-muted mb-0">{{ 'services.subtitle' | translate }}</p>
      </div>
    </div>
    <button type="button" class="btn btn-primary" (click)="openAdd()">
      <i class="fa-solid fa-plus me-1"></i>
      {{ 'services.new' | translate }}
    </button>
  </header>

  <!-- KPIs -->
  <div class="row g-3 mb-4">
    <div class="col-12 col-sm-6 col-lg-3">
      <app-stat-card
        [label]="'services.kpi.total' | translate"
        [value]="kpis().total"
        icon="fa-solid fa-screwdriver-wrench"
        tone="primary">
      </app-stat-card>
    </div>
    <div class="col-12 col-sm-6 col-lg-3">
      <app-stat-card
        [label]="'services.kpi.visible' | translate"
        [value]="kpis().visible"
        icon="fa-solid fa-eye"
        tone="success">
      </app-stat-card>
    </div>
    <div class="col-12 col-sm-6 col-lg-3">
      <app-stat-card
        [label]="'services.kpi.page' | translate"
        [value]="kpis().page"
        icon="fa-solid fa-layer-group"
        tone="info">
      </app-stat-card>
    </div>
    <div class="col-12 col-sm-6 col-lg-3">
      <app-stat-card
        [label]="'services.kpi.pageSize' | translate"
        [value]="kpis().pageSize"
        icon="fa-solid fa-table-list"
        tone="orange">
      </app-stat-card>
    </div>
  </div>

  <!-- Filters -->
  <div class="card mb-4">
    <div class="card-body">
      <div class="row g-3 align-items-end">
        <div class="col-12 col-md flex-grow-1">
          <div class="position-relative">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input class="form-control ps-5"
                   [placeholder]="'services.filters.searchPlaceholder' | translate"
                   [ngModel]="searchTerm"
                   (ngModelChange)="onSearchInput($event)" />
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Table -->
  <div class="card">
    <div class="card-header d-flex align-items-center gap-2">
      <i class="fa-solid fa-screwdriver-wrench text-primary"></i>
      <h5 class="mb-0">
        {{ 'services.title' | translate }}
        <span class="text-muted small">({{ count() }})</span>
      </h5>
      <app-table-tools
        class="ms-auto"
        [reportTitle]="'services.title' | translate"
        [columns]="exportColumns"
        [rows]="rows()"
        [fetchAll]="fetchAllRows"
        [disabled]="loading() || rows().length === 0">
      </app-table-tools>
    </div>

    @if (loadError()) {
      <div class="m-3 mb-0">
        <app-load-error [message]="loadError()" [loading]="loading()" (retry)="reload()"></app-load-error>
      </div>
    }

    <div class="card-body p-0">
      <app-data-table
        [columns]="columns"
        [data]="rows()"
        [loading]="loading()"
        [hasActions]="true"
        [actionsTemplate]="actionsCell"
        trackByKey="id"
        [emptyMessage]="searchSignal() ? ('services.table.emptyFiltered' | translate) : ('services.table.empty' | translate)">
      </app-data-table>
    </div>

    @if (count() > 0) {
      <div class="card-footer">
        <app-pagination
          [pageIndex]="pageIndex()"
          [pageSize]="pageSize()"
          [count]="count()"
          [disabled]="loading()"
          (pageChange)="onPageChange($event)"
          (pageSizeChange)="onPageSizeChange($event)">
        </app-pagination>
      </div>
    }
  </div>
</section>

<!-- Action cell template -->
<ng-template #actionsCell let-row>
  <div class="d-inline-flex gap-1">
    <button type="button"
            class="btn btn-sm btn-light"
            [disabled]="busyId() === row.id"
            [attr.aria-label]="'services.table.edit' | translate"
            (click)="openEdit(row)">
      <i class="fa-solid fa-pen"></i>
    </button>
    <button type="button"
            class="btn btn-sm btn-icon btn-danger-soft"
            [disabled]="busyId() === row.id"
            [attr.aria-label]="'services.table.delete' | translate"
            (click)="confirmDelete(row)">
      <i class="fa-solid fa-trash"></i>
    </button>
  </div>
</ng-template>

@if (dialogMode()) {
  <app-service-form-dialog
    [mode]="dialogMode()!"
    [service]="editing()"
    (saved)="onSaved()"
    (cancel)="closeDialog()">
  </app-service-form-dialog>
}
