<app-modal
  [open]="true"
  [title]="(isEdit() ? 'salesPlaybook.form.editTitle.objections' : 'salesPlaybook.form.createTitle.objections') | translate"
  icon="fa-solid fa-shield-halved"
  iconTone="warning"
  size="lg"
  [closeOnBackdrop]="!submitting()"
  [closeOnEsc]="!submitting()"
  (closed)="close()">

  <form class="pf" [formGroup]="form" (ngSubmit)="submit()" novalidate id="pb-objection-form">
    <div class="pf-grid">
      <div class="pf-field pf-span">
        <label class="form-label fw-600" for="pf-o-cat">{{ 'salesPlaybook.form.category' | translate }}</label>
        <input id="pf-o-cat" class="form-control" formControlName="category" dir="auto" list="pf-o-cats"
               autocomplete="off"
               [maxlength]="limits.category"
               [class.is-invalid]="form.controls.category.invalid && form.controls.category.touched"
               [placeholder]="'salesPlaybook.form.categoryPh' | translate" />
        <datalist id="pf-o-cats">
          @for (c of suggestions(); track c) { <option [value]="c"></option> }
        </datalist>
        <app-form-error [control]="form.controls.category" [label]="'salesPlaybook.form.category' | translate" />
        @if (suggestions().length) {
          <div class="pf-chips mt-2" role="group" [attr.aria-label]="'salesPlaybook.form.categoryHint' | translate">
            @for (c of suggestions(); track c) {
              <button type="button" class="pf-chip" [class.is-on]="value().category?.trim() === c"
                      [attr.aria-pressed]="value().category?.trim() === c" (click)="pickCategory(c)">
                <i [class]="metaOf(c).icon" aria-hidden="true"></i><span dir="auto">{{ c }}</span>
              </button>
            }
          </div>
        }
        <small class="pf-hint">{{ 'salesPlaybook.form.categoryHint' | translate }}</small>
      </div>

      <div class="pf-field pf-span">
        <label class="form-label fw-600" for="pf-o-text">{{ 'salesPlaybook.form.objection' | translate }}</label>
        <input id="pf-o-text" class="form-control" formControlName="objection" dir="auto"
               [maxlength]="limits.objection"
               [class.is-invalid]="form.controls.objection.invalid && form.controls.objection.touched"
               [placeholder]="'salesPlaybook.form.objectionPh' | translate" />
        <app-form-error [control]="form.controls.objection" [label]="'salesPlaybook.form.objection' | translate" />
      </div>

      <div class="pf-field pf-span">
        <label class="form-label fw-600" for="pf-o-answer">{{ 'salesPlaybook.objections.bestAnswer' | translate }}</label>
        <textarea id="pf-o-answer" class="form-control" rows="6" formControlName="answer" dir="auto"
                  [maxlength]="limits.answer"
                  [class.is-invalid]="form.controls.answer.invalid && form.controls.answer.touched"
                  [placeholder]="'salesPlaybook.form.answerPh' | translate"></textarea>
        <span class="pf-counter">{{ value().answer?.length ?? 0 }}/{{ limits.answer }}</span>
        <app-form-error [control]="form.controls.answer" [label]="'salesPlaybook.objections.bestAnswer' | translate" />
      </div>
    </div>

    @if (serverError()) {
      <div class="alert alert-danger d-flex gap-2 align-items-start mt-3 mb-0" role="alert">
        <i class="fa-solid fa-circle-exclamation mt-1"></i><span>{{ serverError() }}</span>
      </div>
    }
  </form>

  <div modal-footer class="btn-row justify-content-end w-100">
    <button type="button" class="btn btn-light" [disabled]="submitting()" (click)="close()">
      {{ 'salesPlaybook.form.cancel' | translate }}
    </button>
    <button type="submit" form="pb-objection-form" class="btn btn-primary" [disabled]="submitting()">
      @if (submitting()) {
        <span class="spinner-border spinner-border-sm me-1"></span>{{ 'salesPlaybook.form.saving' | translate }}
      } @else {
        <i class="fa-solid fa-floppy-disk me-1"></i>{{ 'salesPlaybook.form.save' | translate }}
      }
    </button>
  </div>
</app-modal>
