<form #root class="cc" (submit)="$event.preventDefault(); submit()">
  <div class="cc-tools">
    <button type="button" class="cc-btn" [class.is-on]="emojiOpen()"
            [attr.aria-expanded]="emojiOpen()"
            [attr.aria-label]="'teamChat.emoji' | translate"
            (click)="emojiOpen.set(!emojiOpen())">
      <i class="fa-regular fa-face-smile"></i>
    </button>
    <button type="button" class="cc-btn" disabled
            [appTip]="'teamChat.attachSoon' | translate"
            [attr.aria-label]="'teamChat.attach' | translate">
      <i class="fa-solid fa-paperclip"></i>
    </button>

    @if (emojiOpen()) {
      <div class="cc-emoji" role="menu">
        @for (e of emojis; track e) {
          <button type="button" role="menuitem" class="cc-emoji-btn" (click)="insertEmoji(e)">{{ e }}</button>
        }
      </div>
    }
  </div>

  <textarea #field
            class="cc-field"
            rows="1"
            [attr.maxlength]="maxLength"
            [placeholder]="placeholder()"
            [attr.aria-label]="placeholder()"
            (input)="onInput(field.value)"
            (keydown)="onKeydown($event)"></textarea>

  <button type="submit" class="cc-send" [class.is-ready]="text().trim()" [disabled]="!text().trim()"
          [attr.aria-label]="'teamChat.send' | translate">
    <i class="fa-solid fa-paper-plane"></i>
  </button>
</form>
