@if (file(); as f) {
  <div class="wa-attach">
    @if (preview(); as src) {
      <img class="wa-attach__thumb" [src]="src" alt="" />
    } @else {
      <span class="wa-attach__icon" aria-hidden="true"><i class="fa-regular fa-file-lines"></i></span>
    }
    <span class="wa-attach__info">
      <span class="wa-attach__name" dir="auto" [title]="f.name">{{ f.name }}</span>
      <span class="wa-attach__size">{{ fileSize() }}</span>
    </span>
    <button type="button" class="wa-icon-btn" (click)="removeFile()" [disabled]="busy()"
            [title]="'whatsapp.composer.removeFile' | translate"
            [attr.aria-label]="'whatsapp.composer.removeFile' | translate">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>
}

<div class="wa-compose">
  <button type="button" class="wa-icon-btn" (click)="openPicker()" [disabled]="disabled() || busy()"
          [title]="'whatsapp.composer.attach' | translate"
          [attr.aria-label]="'whatsapp.composer.attach' | translate">
    <i class="fa-solid fa-paperclip"></i>
  </button>
  <input #picker type="file" class="d-none" [accept]="accept" (change)="onPick($event)" tabindex="-1" />

  <textarea #box
            class="wa-compose__input"
            rows="1"
            dir="auto"
            [attr.maxlength]="maxLength"
            [value]="text()"
            [disabled]="disabled()"
            [placeholder]="(file() ? 'whatsapp.composer.captionPlaceholder' : 'whatsapp.composer.placeholder') | translate"
            [attr.aria-label]="'whatsapp.composer.placeholder' | translate"
            [title]="'whatsapp.composer.keyboardHint' | translate"
            (input)="onInput($event)"
            (keydown)="onKeydown($event)"
            (paste)="onPaste($event)"></textarea>

  <button type="button" class="wa-send" (click)="submit()" [disabled]="!canSend()"
          [title]="(busy() ? 'whatsapp.composer.sending' : 'whatsapp.composer.send') | translate"
          [attr.aria-label]="(busy() ? 'whatsapp.composer.sending' : 'whatsapp.composer.send') | translate"
          [attr.aria-busy]="busy()">
    @if (busy()) {
      <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
    } @else {
      <i class="fa-solid fa-paper-plane"></i>
    }
  </button>
</div>

@if (busy()) {
  <p class="wa-compose__hint" role="status">
    <i class="fa-regular fa-clock" aria-hidden="true"></i>
    {{ 'whatsapp.composer.sendingHint' | translate }}
  </p>
}
