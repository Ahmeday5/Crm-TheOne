<div class="container-fluid">

  <!-- Back Button -->
  <button class="btn btn-view mb-4 d-flex align-items-center gap-2" (click)="goToDesignatedClients();">
    ← Back to Assigned Leads
  </button>

  <div class="row g-4">
    <!-- Left Column -->
    <div class="col-lg-8">
      <div class="card shadow-sm">
        <div class="card-body">

          <h5 class="fw-600 mb-4">Technical Consultation</h5>

          <!-- Lead Information -->
          <h6 class="fw-600 mb-3">Lead Information</h6>

          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Client Name</label>
              <input class="form-control" disabled value="سارة علي القحطاني">
            </div>

            <div class="col-md-6">
              <label class="form-label">Company</label>
              <input class="form-control" disabled value="وكالة التسويق الرقمي">
            </div>

            <div class="col-md-6">
              <label class="form-label">Phone Number</label>
              <input class="form-control" disabled value="+966 55 234 5678">
            </div>

            <div class="col-md-6">
              <label class="form-label">Service Requested</label>
              <input class="form-control" disabled value="تطبيق جوال">
            </div>
          </div>

          <div class="mt-4 p-3 rounded bg-primary-subtle">
            <p class="fw-600 mb-1 text-primary">Sales Notes:</p>
            <p class="mb-0">العميل يحتاج استشارة فنية تفصيلية حول إمكانيات التكامل</p>
          </div>

          <hr class="my-4">

          <!-- Consultation Details -->
          <h6 class="fw-600 mb-3">Consultation Details</h6>

          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Consultation Type *</label>
              <select class="form-select">
                <option selected disabled>Select consultation type</option>
                <option>Phone Call</option>
                <option>In-Person Meeting</option>
                <option>Remote Session</option>
                <option>Video Conference</option>
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label">Duration</label>
              <input class="form-control" disabled value="-">
            </div>

            <div class="col-md-6">
              <label class="form-label">Session Start Time</label>
              <input type="time" class="form-control">
            </div>

            <div class="col-md-6">
              <label class="form-label">Session End Time</label>
              <input type="time" class="form-control">
            </div>
          </div>

          <div class="mt-3">
            <button class="btn btn-view">
              ⏱ Start Session Now
            </button>
          </div>

          <hr class="my-4">

          <!-- Technical Details -->
          <h6 class="fw-600 mb-3">Technical Details</h6>

          <div class="mb-3">
            <label class="form-label">Technical Explanation Summary *</label>
            <textarea class="form-control" rows="4"
              placeholder="Provide a summary of the technical explanation..."></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label">Client Requirements</label>
            <textarea class="form-control" rows="4"
              placeholder="Document client requirements..."></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label">Issues Identified</label>
            <textarea class="form-control" rows="4"
              placeholder="List issues identified..."></textarea>
          </div>

        </div>
      </div>

    </div>

    <!-- Right Column -->
    <div class="col-lg-4">

      <!-- Actions -->
      <div class="card shadow-sm mb-4">
        <div class="card-body">

          <h6 class="fw-600 mb-3">Actions</h6>

          <div class="d-grid gap-2">
            <button class="btn btn-view active">Save Consultation</button>
            <button class="btn btn-view">Send Back to Sales</button>
            <button class="btn btn-view">Create Support Ticket</button>
            <hr>
            <button class="btn btn-outline-danger">Cancel</button>
          </div>

        </div>
      </div>

      <!-- Consultation Info -->
      <div class="card shadow-sm">
        <div class="card-body">

          <h6 class="fw-600 mb-3">Consultation Info</h6>

          <div class="mb-3">
            <p class="text-muted mb-1">Client</p>
            <p class="fw-600 mb-0">سارة علي القحطاني</p>
          </div>

          <hr>

          <div class="mb-3">
            <p class="text-muted mb-1">Service</p>
            <p class="fw-600 mb-0">تطبيق جوال</p>
          </div>

          <hr>

          <div class="mb-3">
            <p class="text-muted mb-1">Session Duration</p>
            <p class="fw-700 text-primary fs-4 mb-0">-</p>
          </div>

          <hr>

          <div>
            <p class="text-muted mb-1">Status</p>
            <span class="badge gray">Pending</span>
          </div>

        </div>
      </div>

    </div>

  </div>

</div>
