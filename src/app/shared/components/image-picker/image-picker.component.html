<input #fileInput type="file" accept="image/*" class="visually-hidden" tabindex="-1"
       [disabled]="disabled()" (change)="onPicked($event)">

@if (previewUrl(); as url) {
  <div class="ip-frame">
    <img [src]="url" class="ip-frame__img" alt="" />
    <div class="ip-frame__bar btn-row">
      <button type="button" class="btn btn-sm btn-light" [disabled]="disabled()" (click)="browse()">
        <i class="fa-solid fa-arrow-rotate-right"></i>{{ 'common.image.change' | translate }}
      </button>
      @if (file()) {
        <button type="button" class="btn btn-sm btn-outline-danger" [disabled]="disabled()" (click)="discard()">
          <i class="fa-solid fa-xmark"></i>{{ 'common.image.discard' | translate }}
        </button>
      } @else {
        <button type="button" class="btn btn-sm btn-outline-danger" [disabled]="disabled()" (click)="remove()">
          <i class="fa-solid fa-trash"></i>{{ 'common.image.remove' | translate }}
        </button>
      }
    </div>
  </div>
} @else if (removed()) {
  <div class="ip-removed">
    <span><i class="fa-solid fa-image"></i>{{ 'common.image.removedNotice' | translate }}</span>
    <div class="btn-row">
      <button type="button" class="btn btn-sm btn-light" [disabled]="disabled()" (click)="undoRemove()">
        <i class="fa-solid fa-rotate-left"></i>{{ 'common.image.undo' | translate }}
      </button>
      <button type="button" class="btn btn-sm btn-light" [disabled]="disabled()" (click)="browse()">
        <i class="fa-solid fa-upload"></i>{{ 'common.image.choose' | translate }}
      </button>
    </div>
  </div>
} @else {
  <button type="button" class="ip-drop" [disabled]="disabled()" (click)="browse()">
    <span class="ip-drop__icon"><i class="fa-solid fa-image"></i></span>
    <span class="ip-drop__label">{{ 'common.image.choose' | translate }}</span>
    <span class="ip-drop__hint">{{ 'common.image.hint' | translate }} {{ maxLabel() }}</span>
  </button>
}

@if (error(); as err) {
  <p class="ip-error" role="alert">
    <i class="fa-solid fa-circle-exclamation"></i>
    {{ ('common.image.' + err) | translate }}
    @if (err === 'tooLarge') { ({{ maxLabel() }}) }
  </p>
}
