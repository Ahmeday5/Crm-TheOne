<div class="card kpi-card stat-card">
  <div class="card-body stat-card__body">
    <div class="stat-card__text">
      <p class="stat-card__label text-muted small mb-1" [title]="label()">{{ label() }}</p>
      <h3 class="fw-700 mb-0 kpi-value stat-card__value" [ngClass]="valueClass()">{{ value() }}</h3>
      @if (sub()) {
        <p class="stat-card__sub text-muted small mb-0 mt-1">{{ sub() }}</p>
      }
    </div>
    @if (icon()) {
      <span class="icon-tile xl tone-{{ tone() }} stat-card__icon">
        <i [class]="icon()"></i>
      </span>
    }
  </div>
</div>
