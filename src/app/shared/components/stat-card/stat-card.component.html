<div class="card kpi-card stat-card">
  <div class="card-body d-flex align-items-center justify-content-between gap-3">
    <div class="flex-grow-1">
      <p class="text-muted small mb-1">{{ label() }}</p>
      <h3 class="fw-700 mb-0 kpi-value" [ngClass]="valueClass()">{{ value() }}</h3>
      @if (sub()) {
        <p class="text-muted small mb-0 mt-1">{{ sub() }}</p>
      }
    </div>
    @if (icon()) {
      <span class="icon-tile xl tone-{{ tone() }}">
        <i [class]="icon()"></i>
      </span>
    }
  </div>
</div>
