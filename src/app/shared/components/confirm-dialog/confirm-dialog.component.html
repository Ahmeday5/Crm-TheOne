@if (state().isOpen) {
  <div class="confirm-backdrop" (click)="cancel()">
    <div class="confirm-card" [class]="'confirm-card tone-' + (state().config.type || 'info')"
         (click)="$event.stopPropagation()" role="dialog" aria-modal="true">
      <span class="confirm-icon"><i [class]="iconOf(state().config.type)"></i></span>
      <h5 class="fw-700 mb-2">{{ state().config.title }}</h5>
      <p class="text-muted mb-4">{{ state().config.message }}</p>
      <div class="d-flex gap-2 justify-content-end">
        <button type="button" class="btn btn-light" (click)="cancel()">
          {{ state().config.cancelText }}
        </button>
        <button type="button" class="btn"
                [class.btn-danger]="state().config.type === 'danger'"
                [class.btn-warning]="state().config.type === 'warning'"
                [class.btn-primary]="state().config.type !== 'danger' && state().config.type !== 'warning'"
                (click)="confirm()">
          {{ state().config.confirmText }}
        </button>
      </div>
    </div>
  </div>
}
