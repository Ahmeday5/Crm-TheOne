<header class="app-header sticky-top border-bottom shadow-sm">
  <div class="d-flex align-items-center justify-content-between gap-3 h-100 px-3 px-lg-4">

    <!-- Left: brand + sidebar toggle -->
    <div class="d-flex align-items-center gap-3">
      <button class="btn-icon d-lg-none" type="button" data-sidebar-toggle (click)="toggleSidebar()" aria-label="menu">
        <i class="fa-solid fa-bars fs-3"></i>
      </button>

      <div class="d-flex align-items-center gap-3">
        <img [src]="brandLogo() || fallbackLogo" class="brand-logo" alt="logo"
             (error)="onLogoError($event)">
        <div class="d-none d-sm-block">
          <h1 class="brand-title mb-0">{{ brandName() || ('header.app' | translate) }}</h1>
          <small class="text-muted d-block">{{ 'header.tagline' | translate }}</small>
        </div>
      </div>
    </div>

    <!-- Right: language, theme, notifications, user -->
    <div class="d-flex align-items-center gap-2">
      <app-language-toggle></app-language-toggle>
      <app-theme-toggle></app-theme-toggle>

      <app-notifications-bell></app-notifications-bell>

      <div class="dropdown">
        <button class="btn btn-light d-flex align-items-center gap-2 user-pill" type="button" data-bs-toggle="dropdown">
          <span class="user-avatar"><i class="fa-solid fa-user"></i></span>
          <span class="d-none d-md-inline-block text-start">
            <span class="d-block fw-700 text-truncate" style="max-width: 180px;">{{ currentUser()?.fullName ||
              currentUser()?.email || ('header.profile' | translate) }}</span>
            <small class="text-muted">{{ currentRoleLabel() }}</small>
          </span>
        </button>

        <ul class="dropdown-menu dropdown-menu-end">
          <li>
            <a class="dropdown-item">
              <i class="fa-regular fa-user me-2"></i>{{ 'header.profile' | translate }}
            </a>
          </li>
          <li>
            <a routerLink="/settings/users" class="dropdown-item">
              <i class="fa-solid fa-gear me-2"></i>{{ 'header.settings' | translate }}
            </a>
          </li>
          <li>
            <hr class="dropdown-divider">
          </li>
          <li>
            <button type="button" class="dropdown-item text-danger" (click)="logout()">
              <i class="fa-solid fa-right-from-bracket me-2"></i>{{ 'header.logout' | translate }}
            </button>
          </li>
        </ul>
      </div>
    </div>
  </div>
</header>
